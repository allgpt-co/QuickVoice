name: Deploy QuickVoice MCP Server

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp-server/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/deploy-mcp-server.yml"
  workflow_dispatch:

concurrency:
  group: quickvoice-mcp-server-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  MCP_ECR_REPOSITORY: ${{ vars.MCP_ECR_REPOSITORY }}
  MCP_COOLIFY_WEBHOOK_URL: ${{ vars.MCP_COOLIFY_WEBHOOK_URL }}

jobs:
  validate-config:
    name: Validate MCP Deployment Config
    runs-on: self-hosted
    steps:
      - name: Validate required GitHub variables and secrets
        env:
          REQUIRED_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REQUIRED_AWS_REGION: ${{ env.AWS_REGION }}
          REQUIRED_MCP_ECR_REPOSITORY: ${{ env.MCP_ECR_REPOSITORY }}
          REQUIRED_MCP_COOLIFY_WEBHOOK_URL: ${{ env.MCP_COOLIFY_WEBHOOK_URL }}
          REQUIRED_COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${REQUIRED_AWS_ROLE_ARN}" ]; then
            echo "[fail] Missing GitHub repository variable: AWS_ROLE_ARN"
            missing=1
          fi
          if [ -z "${REQUIRED_AWS_REGION}" ]; then
            echo "[fail] Missing GitHub repository variable: AWS_REGION"
            missing=1
          fi
          if [ -z "${REQUIRED_MCP_ECR_REPOSITORY}" ]; then
            echo "[fail] Missing GitHub repository variable: MCP_ECR_REPOSITORY"
            missing=1
          fi
          if [ -z "${REQUIRED_MCP_COOLIFY_WEBHOOK_URL}" ]; then
            echo "[fail] Missing GitHub repository variable: MCP_COOLIFY_WEBHOOK_URL"
            missing=1
          fi
          if [ -z "${REQUIRED_COOLIFY_API_TOKEN}" ]; then
            echo "[fail] Missing GitHub repository secret: COOLIFY_API_TOKEN"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            {
              echo "## MCP deployment configuration"
              echo "[fail] Missing required GitHub Actions configuration."
              echo ""
              echo "Set these before running this workflow:"
              echo "- Repository variable: AWS_ROLE_ARN"
              echo "- Repository variable: AWS_REGION"
              echo "- Repository variable: MCP_ECR_REPOSITORY"
              echo "- Repository variable: MCP_COOLIFY_WEBHOOK_URL"
              echo "- Repository secret: COOLIFY_API_TOKEN"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          {
            echo "## MCP deployment configuration"
            echo "[ok] Required GitHub Actions configuration is present."
            echo "- AWS region: ${REQUIRED_AWS_REGION}"
            echo "- MCP ECR repository: ${REQUIRED_MCP_ECR_REPOSITORY}"
          } >> "${GITHUB_STEP_SUMMARY}"

  security-audit:
    name: Security Audit
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit:deps --audit-level low

  build-and-push:
    name: Build and Push MCP Server Image
    runs-on: self-hosted
    needs: [validate-config, security-audit]
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      digest: ${{ steps.mcp-build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push MCP server Docker image
        id: mcp-build
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:sha-${{ github.sha }}
          LATEST_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:latest
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx build \
              --file apps/mcp-server/Dockerfile \
              --tag "${IMAGE_TAG}" \
              --tag "${LATEST_TAG}" \
              --load \
              . && docker push "${IMAGE_TAG}" && docker push "${LATEST_TAG}"; then
              digest="$(aws ecr describe-images \
                --repository-name "${MCP_ECR_REPOSITORY}" \
                --image-ids imageTag="sha-${GITHUB_SHA}" \
                --query 'imageDetails[0].imageDigest' \
                --output text)"
              if [ -z "${digest}" ] || [ "${digest}" = "None" ]; then
                echo "[fail] Could not resolve pushed MCP server image digest."
                exit 1
              fi
              echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Docker MCP server build/push failed on attempt ${attempt}; retrying after transient registry/network failure..."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Export MCP image metadata
        id: image
        env:
          IMAGE_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:sha-${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.mcp-build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${IMAGE_TAG%@*}@${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test pushed MCP image manifest
        env:
          MCP_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: docker buildx imagetools inspect "${MCP_IMAGE_URI}"

  trigger-coolify:
    name: Trigger Coolify Deploy
    runs-on: self-hosted
    needs: build-and-push
    environment:
      name: production-mcp-server
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ env.MCP_COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          MCP_IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          MCP_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --request POST "${COOLIFY_WEBHOOK_URL}" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Content-Type: application/json"

          {
            echo "## Coolify deployment triggered"
            echo "- Image URI: ${MCP_IMAGE_URI}"
            echo "- Image tag: ${MCP_IMAGE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

  scan-image:
    name: Scan MCP Image
    runs-on: self-hosted
    needs: build-and-push
    if: needs.build-and-push.result == 'success'
    steps:
      - name: Scan MCP image for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image_uri }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          timeout: 20m0s
          exit-code: "1"

      - name: Report MCP scan warning
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::warning::MCP image vulnerability scan reported findings or could not complete."
          {
            echo "## MCP image scan"
            echo "[warn] Advisory scan reported findings or could not complete."
            echo "- Image: ${{ needs.build-and-push.outputs.image_uri }}"
          } >> "${GITHUB_STEP_SUMMARY}"
