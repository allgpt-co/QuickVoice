name: Deploy QuickVoice MCP Server

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit SHA to validate and deploy
        required: true
        type: string

concurrency:
  group: quickvoice-mcp-server-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  MCP_ECR_REPOSITORY: ${{ vars.MCP_ECR_REPOSITORY }}
  COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
  COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID: ${{ vars.COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID }}

jobs:
  validate-config:
    name: Validate MCP Deployment Config
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate required GitHub variables and secrets
        env:
          REQUIRED_AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REQUIRED_AWS_REGION: ${{ env.AWS_REGION }}
          REQUIRED_MCP_ECR_REPOSITORY: ${{ env.MCP_ECR_REPOSITORY }}
          REQUIRED_COOLIFY_API_URL: ${{ env.COOLIFY_API_URL }}
          REQUIRED_COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID: ${{ env.COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${REQUIRED_AWS_ROLE_ARN}" ]; then
            echo "[fail] Missing GitHub repository variable: AWS_ROLE_ARN"
            missing=1
          fi
          if [ -z "${REQUIRED_AWS_REGION}" ]; then
            echo "[fail] Missing GitHub repository variable: AWS_REGION"
            missing=1
          fi
          if [ -z "${REQUIRED_MCP_ECR_REPOSITORY}" ]; then
            echo "[fail] Missing GitHub repository variable: MCP_ECR_REPOSITORY"
            missing=1
          fi
          if [ -z "${REQUIRED_COOLIFY_API_URL}" ]; then
            echo "[fail] Missing GitHub repository variable: COOLIFY_API_URL"
            missing=1
          fi
          if [ -z "${REQUIRED_COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID}" ]; then
            echo "[fail] Missing GitHub repository variable: COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID"
            missing=1
          fi

          if [ "${missing}" -ne 0 ]; then
            {
              echo "## MCP deployment configuration"
              echo "[fail] Missing required GitHub Actions configuration."
              echo ""
              echo "Set these before running this workflow:"
              echo "- Repository variable: AWS_ROLE_ARN"
              echo "- Repository variable: AWS_REGION"
              echo "- Repository variable: MCP_ECR_REPOSITORY"
              echo "- Repository variable: COOLIFY_API_URL"
              echo "- Repository variable: COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID"
              echo "- Production environment secret: COOLIFY_API_TOKEN"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          {
            echo "## MCP deployment configuration"
            echo "[ok] Required GitHub Actions configuration is present."
            echo "- AWS region: ${REQUIRED_AWS_REGION}"
            echo "- MCP ECR repository: ${REQUIRED_MCP_ECR_REPOSITORY}"
            echo "- Coolify MCP app UUID: ${REQUIRED_COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  security-audit:
    name: MCP Validation and Security Audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck MCP server
        run: pnpm --filter quickvoice-mcp-server lint

      - name: Build MCP server
        run: pnpm --filter quickvoice-mcp-server build

      - name: Run MCP transport tests
        run: pnpm --filter quickvoice-mcp-server test:transport

      - name: Run security audit
        run: pnpm audit:deps --audit-level low

  build-and-push:
    name: Build and Push MCP Server Image
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    needs: [validate-config, security-audit]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production-mcp-server
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      digest: ${{ steps.mcp-build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push MCP server Docker image
        id: mcp-build
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:sha-${{ inputs.source_sha }}
          LATEST_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:latest
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx build \
              --file apps/mcp-server/Dockerfile \
              --tag "${IMAGE_TAG}" \
              --tag "${LATEST_TAG}" \
              --load \
              . && docker push "${IMAGE_TAG}" && docker push "${LATEST_TAG}"; then
              digest="$(aws ecr describe-images \
                --repository-name "${MCP_ECR_REPOSITORY}" \
                --image-ids imageTag="sha-${SOURCE_SHA}" \
                --query 'imageDetails[0].imageDigest' \
                --output text)"
              if [ -z "${digest}" ] || [ "${digest}" = "None" ]; then
                echo "[fail] Could not resolve pushed MCP server image digest."
                exit 1
              fi
              echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Docker MCP server build/push failed on attempt ${attempt}; retrying after transient registry/network failure..."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Export MCP image metadata
        id: image
        env:
          IMAGE_TAG: ${{ steps.login-ecr.outputs.registry }}/${{ env.MCP_ECR_REPOSITORY }}:sha-${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.mcp-build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${IMAGE_TAG%@*}@${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test pushed MCP image manifest
        env:
          MCP_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: docker buildx imagetools inspect "${MCP_IMAGE_URI}"

  trigger-coolify:
    name: Deploy and Verify MCP Image
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    environment:
      name: production-mcp-server
    steps:
      - name: Checkout verified deployment helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_URL: ${{ env.COOLIFY_API_URL }}
          COOLIFY_RESOURCE_UUID: ${{ env.COOLIFY_QUICKVOICE_MCP_RESOURCE_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          MCP_IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          MCP_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image_name="${MCP_IMAGE_TAG%:*}"
          tag="${MCP_IMAGE_TAG##*:}"

          DEPLOY_IMAGE_TAG="$MCP_IMAGE_TAG" node .github/scripts/deploy-image.mjs

          {
            echo "## Coolify deployment verified healthy"
            echo "- Coolify app UUID: ${COOLIFY_RESOURCE_UUID}"
            echo "- Image URI: ${MCP_IMAGE_URI}"
            echo "- Image tag: ${MCP_IMAGE_TAG}"
            echo "- Coolify image tag: ${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"

  scan-image:
    name: Scan MCP Image
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (needs.build-and-push.result == 'success')
    steps:
      - name: Scan MCP image for vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image_uri }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          timeout: 20m0s
          exit-code: "1"

      - name: Report MCP scan warning
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "::warning::MCP image vulnerability scan reported findings or could not complete."
          {
            echo "## MCP image scan"
            echo "[warn] Advisory scan reported findings or could not complete."
            echo "- Image: ${{ needs.build-and-push.outputs.image_uri }}"
          } >> "${GITHUB_STEP_SUMMARY}"
