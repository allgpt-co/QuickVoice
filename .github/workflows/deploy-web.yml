name: Deploy QuickVoice Website

on:
  workflow_dispatch:
    inputs:
      contact_attribution:
        description: Contact attribution (enable only after compatible API delivery is verified)
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      manual_pageviews:
        description: Manual pageviews (enable only after GA browser-history views are disabled)
        type: choice
        default: preserve
        options: [preserve, enable, disable]
      compatible_api_commit:
        description: Full deployed compatible API revision (required to enable contact attribution)
        type: string
        default: ""
      prerequisites_verified:
        description: Required for enable actions; prerequisite checks recorded in release evidence
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: quickvoice-web-production
  cancel-in-progress: false

jobs:
  deploy-web:
    if: >-
      vars.PRODUCTION_ENVIRONMENTS_PROTECTED == 'true' &&
      github.repository == 'allgpt-co/QuickVoice' &&
      github.ref == 'refs/heads/main'
    # Use the same established deployment network as Backend Build and Deploy.
    runs-on: self-hosted
    timeout-minutes: 30
    environment:
      name: production-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Confirm this run still targets current main
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$GITHUB_SHA"
      - name: Require successful quality and security checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/allgpt-co/QuickVoice/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs' > "$RUNNER_TEMP/web-release-checks.json"
          jq -e '
            . as $checks |
            ["Quality Summary", "Dependency Security Audit"] |
            all(. as $name |
              [$checks[] | select(.name == $name)] |
              sort_by(.started_at) | last |
              .status == "completed" and .conclusion == "success")
          ' "$RUNNER_TEMP/web-release-checks.json"
      - name: Deploy and verify the marketing application
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          CONTACT_ATTRIBUTION_ACTION: ${{ inputs.contact_attribution }}
          MANUAL_PAGEVIEWS_ACTION: ${{ inputs.manual_pageviews }}
          ROLLOUT_PREREQUISITES_VERIFIED: ${{ inputs.prerequisites_verified }}
          COMPATIBLE_API_COMMIT: ${{ inputs.compatible_api_commit }}
        run: node .github/scripts/deploy-web.mjs
