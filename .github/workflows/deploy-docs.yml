# Required repository or production-docs environment variables:
#   AWS_ROLE_ARN                     GitHub OIDC deployment role
#   DOCS_S3_BUCKET                   S3 bucket name (without s3://)
#   DOCS_S3_PREFIX                   S3 key prefix for docs artifacts (no leading/trailing slash)
#   CLOUDFRONT_DISTRIBUTION_ID       CloudFront distribution ID
# Optional: AWS_REGION (defaults to us-east-1), NEXT_PUBLIC_GA_MEASUREMENT_ID
# The AWS role, S3 bucket, and CloudFront distribution must already exist.

name: Deploy QuickVoice Docs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch: {}

concurrency:
  group: quickvoice-docs-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-docs
    if: >-
      vars.PRODUCTION_ENVIRONMENTS_PROTECTED == 'true' && (
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
      )
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DOCS_S3_BUCKET: ${{ vars.DOCS_S3_BUCKET }}
      DOCS_S3_PREFIX: ${{ vars.DOCS_S3_PREFIX || 'quickvoice/docs/prod' }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs
        run: pnpm --filter docs lint

      - name: Typecheck docs
        run: pnpm --filter docs check-types

      - name: Build static docs
        run: pnpm --filter docs build

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/docs/out/index.html
          test -d apps/docs/out/_next/static

          if [ -z "${AWS_ROLE_ARN}" ] || [ -z "${DOCS_S3_BUCKET}" ] || [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "Missing AWS_ROLE_ARN, DOCS_S3_BUCKET, or CLOUDFRONT_DISTRIBUTION_ID."
            exit 1
          fi

      - name: Upload verified docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickvoice-docs-${{ github.event.workflow_run.head_sha || github.sha }}
          path: apps/docs/out
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy verified docs artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      id-token: write
    environment:
      name: production-docs
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DOCS_S3_BUCKET: ${{ vars.DOCS_S3_BUCKET }}
      DOCS_S3_PREFIX: ${{ vars.DOCS_S3_PREFIX || 'quickvoice/docs/prod' }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download verified docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quickvoice-docs-${{ github.event.workflow_run.head_sha || github.sha }}
          path: apps/docs/out

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload docs to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync \
            apps/docs/out/_next/static/ \
            "s3://${DOCS_S3_BUCKET}/${DOCS_S3_PREFIX}/_next/static/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --only-show-errors

          aws s3 sync \
            apps/docs/out/ \
            "s3://${DOCS_S3_BUCKET}/${DOCS_S3_PREFIX}/" \
            --delete \
            --exclude "_next/static/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

          aws s3 cp \
            apps/docs/out/index.html \
            "s3://${DOCS_S3_BUCKET}/${DOCS_S3_PREFIX}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --only-show-errors

      - name: Invalidate CloudFront
        id: invalidate
        shell: bash
        run: |
          set -euo pipefail

          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          echo "invalidation_id=${invalidation_id}" >> "${GITHUB_OUTPUT}"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## QuickVoice docs deployed"
            echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "- S3 location: s3://${DOCS_S3_BUCKET}/${DOCS_S3_PREFIX}/"
            echo "- CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"
            echo "- Invalidation: ${{ steps.invalidate.outputs.invalidation_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"
