name: QuickVoice AI Hotfix Deploy

on:
  workflow_dispatch:
    inputs:
      ai_image:
        description: Fully qualified QuickVoice AI image with an explicit tag to deploy
        required: true

permissions:
  contents: read

jobs:
  deploy-ai:
    name: Deploy QuickVoice AI Image
    runs-on: self-hosted
    if: vars.PRODUCTION_ENVIRONMENTS_PROTECTED == 'true'
    environment:
      name: production-backend
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_QUICKVOICE_AI_RESOURCE_UUID: ${{ vars.COOLIFY_QUICKVOICE_AI_RESOURCE_UUID }}
      AI_IMAGE: ${{ inputs.ai_image }}
    steps:
      - name: Trigger Coolify AI deployment
        id: deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_API_URL}" ] || [ -z "${COOLIFY_QUICKVOICE_AI_RESOURCE_UUID}" ] || [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "[fail] Missing COOLIFY_API_URL, COOLIFY_QUICKVOICE_AI_RESOURCE_UUID, or COOLIFY_API_TOKEN."
            exit 1
          fi

          if [[ ! "${AI_IMAGE}" =~ ^[a-z0-9][a-z0-9._:/-]*:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}(@sha256:[a-f0-9]{64})?$ ]]; then
            echo "[fail] AI_IMAGE must be an image reference with an explicit tag and optional sha256 digest."
            exit 1
          fi

          image_without_digest="${AI_IMAGE%@*}"
          image_name="${image_without_digest%:*}"
          tag="${image_without_digest##*:}"

          payload="$(jq -cn --arg image_name "$image_name" --arg tag "$tag" \
            '{docker_registry_image_name: $image_name, docker_registry_image_tag: $tag}')"

          curl --fail --show-error --silent \
            --request PATCH "${COOLIFY_API_URL}/applications/${COOLIFY_QUICKVOICE_AI_RESOURCE_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload"

          curl --fail --show-error --silent \
            --request POST "${COOLIFY_API_URL}/deploy?uuid=${COOLIFY_QUICKVOICE_AI_RESOURCE_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Content-Type: application/json"

          {
            echo "## QuickVoice AI hotfix deploy"
            echo "- Coolify AI app UUID: ${COOLIFY_QUICKVOICE_AI_RESOURCE_UUID}"
            echo "- Requested AI image: ${AI_IMAGE}"
            echo "- Coolify image tag: ${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"
