name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-config:
    name: Workspace Config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace tasks
        run: pnpm check:tasks

      - name: Verify shared configs
        run: pnpm check:configs

  root-tests:
    name: Root Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run root tests
        run: node --test tests/*.test.mjs

      - name: Setup Python for offline SEO operations tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SEO reporting and lead reconciliation without credentials
        run: pnpm test:seo-operations

  console:
    name: Console Lint, Types, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint console
        run: pnpm --filter console lint

      - name: Typecheck console
        run: pnpm --filter console check-types

      - name: Build console
        run: pnpm --filter console build

      - name: Run console tests
        run: node --test apps/console/tests/*.test.mjs

  web:
    name: Web Lint, Types, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter web lint

      - name: Typecheck web
        run: pnpm --filter web check-types

      - name: Run web tests
        run: pnpm --filter web test

      - name: Audit SEO campaign evidence
        run: pnpm claims:audit:seo

      - name: Build web
        run: pnpm --filter web build

  docs:
    name: Docs Lint, Types, Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs
        run: pnpm --filter docs lint

      - name: Typecheck docs
        run: pnpm --filter docs check-types

      - name: Build docs
        run: pnpm --filter docs build

  server:
    name: Server Lint, Types, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      schema-postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quickvoice_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quickvoice_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rate-limit-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter server exec prisma generate
        env:
          # Prisma config requires a syntactically valid URL during generation,
          # but `prisma generate` does not connect to the database.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickvoice_ci

      - name: Verify migration history matches Prisma schema
        run: |
          pnpm --filter server exec prisma migrate deploy
          pnpm --filter server exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quickvoice_ci

      - name: Lint server
        run: pnpm --filter server lint

      - name: Typecheck server
        run: pnpm --filter server check-types

      - name: Build server
        run: pnpm --filter server build

      - name: Run server tests
        run: pnpm --filter server test
        env:
          TEST_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379

  mcp-server:
    name: MCP Server Types, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint MCP server
        run: pnpm --filter quickvoice-mcp-server lint

      - name: Typecheck MCP server
        run: pnpm --filter quickvoice-mcp-server check-types

      - name: Build MCP server
        run: pnpm --filter quickvoice-mcp-server build

      - name: Run MCP transport tests
        run: pnpm --filter quickvoice-mcp-server test:transport

  widget:
    name: Widget Lint, Types, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint widget
        run: pnpm --filter quickvoice-widget lint

      - name: Typecheck widget
        run: pnpm --filter quickvoice-widget check-types

      - name: Build widget
        run: pnpm --filter quickvoice-widget build

      - name: Test widget bundle
        run: pnpm --filter quickvoice-widget test

  ai-python:
    name: AI Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/ai/requirements.txt
            apps/ai/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: apps/ai
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        working-directory: apps/ai
        run: python -m pip_audit --local

      - name: Run AI tests
        working-directory: apps/ai
        run: python -m pytest tests -W error

  docker-server:
    name: Server Docker Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server image target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build \
              --target build \
              --tag quickvoice-server:ci \
              --file apps/server/Dockerfile \
              .; then
              exit 0
            fi
            echo "Docker server build failed on attempt ${attempt}; retrying after transient registry/network failure..."
            sleep $((attempt * 20))
          done
          exit 1

  docker-ai:
    name: AI Docker Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build AI image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build \
              --build-arg PREINSTALL_CPU_TORCH=true \
              --build-arg SKIP_MODEL_DOWNLOAD=true \
              --tag quickvoice-ai:ci \
              --file apps/ai/Dockerfile \
              apps/ai; then
              exit 0
            fi
            echo "Docker AI build failed on attempt ${attempt}; retrying after transient registry/network failure..."
            sleep $((attempt * 20))
          done
          exit 1

  docker-minilm-tei:
    name: MiniLM TEI Docker Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build pinned MiniLM TEI image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build \
              --tag quickvoice-minilm-tei:ci \
              --file apps/ai/embeddings/minilm_l12_v2/Dockerfile \
              apps/ai/embeddings/minilm_l12_v2; then
              exit 0
            fi
            echo "MiniLM TEI build failed on attempt ${attempt}; retrying after transient registry/network failure..."
            sleep $((attempt * 20))
          done
          exit 1

      - name: Verify derived model provenance
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create quickvoice-minilm-tei:ci)"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp \
            "${container_id}:/models/all-MiniLM-L12-v2/quickvoice-model-manifest.json" \
            /tmp/quickvoice-model-manifest.json
          python3 - <<'PY'
          import json

          with open("/tmp/quickvoice-model-manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["model_id"] == "sentence-transformers/all-MiniLM-L12-v2"
          assert manifest["revision"] == "a50ef00143b4d5391434df20ae11632588ac25be"
          assert manifest["source_max_seq_length"] == 128
          assert manifest["runtime_max_seq_length"] == 256
          assert len(manifest["derived_sentence_bert_config_sha256"]) == 64
          PY

      - name: Run authenticated MiniLM TEI canary
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --env API_KEY=ci-test-key \
            --publish 127.0.0.1:18080:80 \
            quickvoice-minilm-tei:ci)"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --header 'Authorization: Bearer ci-test-key' \
              http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "MiniLM TEI did not become healthy"
              exit 1
            fi
            sleep 2
          done

          unauthorized_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"input":["health probe"],"model":"all-MiniLM-L12-v2"}' \
            http://127.0.0.1:18080/v1/embeddings)"
          test "${unauthorized_status}" = "401"

          python3 - <<'PY'
          import json
          import math
          import urllib.request

          headers = {"Authorization": "Bearer ci-test-key"}
          info_request = urllib.request.Request("http://127.0.0.1:18080/info", headers=headers)
          with urllib.request.urlopen(info_request, timeout=10) as response:
              info = json.load(response)
          assert info["model_id"] == "/models/all-MiniLM-L12-v2"
          assert info["served_model_name"] == "all-MiniLM-L12-v2"
          assert info["max_input_length"] == 256

          body = json.dumps({
              "input": ["QuickVoice knowledge embedding canary"],
              "model": "all-MiniLM-L12-v2",
          }).encode()
          embed_request = urllib.request.Request(
              "http://127.0.0.1:18080/v1/embeddings",
              data=body,
              headers={**headers, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(embed_request, timeout=30) as response:
              payload = json.load(response)
          vector = payload["data"][0]["embedding"]
          assert len(vector) == 384
          assert all(math.isfinite(value) for value in vector)
          PY

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - workspace-config
      - root-tests
      - console
      - web
      - docs
      - server
      - mcp-server
      - widget
      - ai-python
      - docker-server
      - docker-ai
      - docker-minilm-tei
    steps:
      - name: Write quality gate summary
        run: |
          {
            echo "## Quality gate"
            echo "- Workspace config: ${{ needs.workspace-config.result }}"
            echo "- Root tests: ${{ needs.root-tests.result }}"
            echo "- Console: ${{ needs.console.result }}"
            echo "- Web: ${{ needs.web.result }}"
            echo "- Docs: ${{ needs.docs.result }}"
            echo "- Server: ${{ needs.server.result }}"
            echo "- MCP server: ${{ needs.mcp-server.result }}"
            echo "- Widget: ${{ needs.widget.result }}"
            echo "- AI Python: ${{ needs.ai-python.result }}"
            echo "- Server Docker: ${{ needs.docker-server.result }}"
            echo "- AI Docker: ${{ needs.docker-ai.result }}"
            echo "- MiniLM TEI Docker: ${{ needs.docker-minilm-tei.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any quality job failed
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.workspace-config.result }}" \
            "${{ needs.root-tests.result }}" \
            "${{ needs.console.result }}" \
            "${{ needs.web.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.server.result }}" \
            "${{ needs.mcp-server.result }}" \
            "${{ needs.widget.result }}" \
            "${{ needs.ai-python.result }}" \
            "${{ needs.docker-server.result }}" \
            "${{ needs.docker-ai.result }}" \
            "${{ needs.docker-minilm-tei.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Quality job result was ${result}"
              exit 1
            fi
          done

  deployment-changes:
    name: Detect Production Deployment Changes
    runs-on: ubuntu-latest
    needs: quality-summary
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.detect.outputs.server }}
      ai: ${{ steps.detect.outputs.ai }}
      mcp: ${{ steps.detect.outputs.mcp }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Detect deployable changes from the tested push
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$SOURCE_SHA" ]; then
            {
              echo "server=false"
              echo "ai=false"
              echo "mcp=false"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Production deployment skipped"
              echo "- Tested commit: ${SOURCE_SHA}"
              echo "- Current main: ${current_main}"
              echo "- Reason: a newer main commit exists"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          backend_base="$(DEPLOY_JOB='Deploy CI-Verified Backend / Deploy and Verify Backend Images' bash .github/scripts/deploy-diff-base.sh)"
          mcp_base="$(DEPLOY_JOB='Deploy CI-Verified MCP Server / Deploy and Verify MCP Image' bash .github/scripts/deploy-diff-base.sh)"
          changed_files="$(git diff --name-only "$backend_base" "$SOURCE_SHA")"
          mcp_changed_files="$(git diff --name-only "$mcp_base" "$SOURCE_SHA")"

          server=false
          ai=false
          mcp=false

          # Avoid grep -q closing a pipe early and hiding matches under pipefail.
          if grep -Eq '^(apps/server/|packages/typescript-config/|scripts/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.github/workflows/ci\.yml$|\.github/workflows/backend-build\.yml$)' <<< "$changed_files"; then
            server=true
          fi
          if grep -Eq '^(apps/ai/|scripts/|\.github/workflows/ci\.yml$|\.github/workflows/backend-build\.yml$)' <<< "$changed_files"; then
            ai=true
          fi
          if grep -Eq '^(apps/mcp-server/|packages/typescript-config/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|\.github/workflows/deploy-mcp-server\.yml$)' <<< "$mcp_changed_files"; then
            mcp=true
          fi

          {
            echo "server=${server}"
            echo "ai=${ai}"
            echo "mcp=${mcp}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Production deployment changes"
            echo "- CI-verified commit: ${SOURCE_SHA}"
            echo "- Server: ${server}"
            echo "- AI: ${ai}"
            echo "- MCP: ${mcp}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy CI-Verified Backend
    needs: deployment-changes
    if: >-
      vars.PRODUCTION_ENVIRONMENTS_PROTECTED == 'true' &&
      (needs.deployment-changes.outputs.server == 'true' || needs.deployment-changes.outputs.ai == 'true')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-build.yml
    with:
      source_sha: ${{ github.sha }}
      server_changed: ${{ needs.deployment-changes.outputs.server == 'true' }}
      ai_changed: ${{ needs.deployment-changes.outputs.ai == 'true' }}
    secrets: inherit

  deploy-mcp:
    name: Deploy CI-Verified MCP Server
    needs: deployment-changes
    if: vars.PRODUCTION_ENVIRONMENTS_PROTECTED == 'true' && needs.deployment-changes.outputs.mcp == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-mcp-server.yml
    with:
      source_sha: ${{ github.sha }}
    secrets: inherit

  deployment-recovery:
    name: Deployment Recovery Instructions
    runs-on: ubuntu-latest
    needs: [quality-summary, deploy-backend, deploy-mcp]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    steps:
      - run: |
          echo "::error::Deployment did not complete. Fix the failed checks, then run CI via workflow_dispatch on main. CI will revalidate the commit before deployment; change detection includes changes since the last successful deployment."
